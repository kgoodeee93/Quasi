<!doctype html>
<html lang="en" data-palette="aurora">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080F">
  <title>Quasi · Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 16l5-5 4 4 7-7"/><path d="M14 8h6v6"/></svg>
        </div>
        <div>
          <div class="brand-name">Quasi</div>
          <div class="brand-sub">Portfolio <span class="badge" id="demo-badge" hidden>Demo data</span></div>
        </div>
      </div>
      <nav class="wallet-nav" id="wallet-nav" aria-label="Wallets"></nav>
      <div class="spacer"></div>
      <div class="tools">
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="sr-only">Search assets</span>
          <input type="search" id="search" placeholder="Search assets">
        </label>
        <span class="meta" id="updated"></span>
        <button class="icon-btn" id="palette" aria-label="Change color palette" title="Palette">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18c1.2 0 2-.8 2-1.9 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>
        </button>
        <button class="icon-btn" id="refresh" aria-label="Refresh balances and prices" title="Refresh">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
        </button>
      </div>
    </header>

    <div id="warnings"></div>
    <main id="content"><div class="empty card">Loading portfolio…</div></main>

    <footer class="footer">
      <span>Prices &amp; market data: CoinGecko · Balances read live from chain</span>
      <span>24h PnL = value change of what you hold now; transfers and trades in the window aren't counted.</span>
    </footer>
  </div>
</div>
<div class="tooltip" id="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
