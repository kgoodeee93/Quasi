/* ===== NAPKIN THEME (light). Do not change tokens, fonts, or stage size ===== */
:root{
  --bg:#F6F7F9; --panel:#FFFFFF; --panel-2:#EEF1F5; --line:#E1E5EA; --line-2:#CDD3DB;
  --text:#0B0C0F; --text-soft:#4A5260; --muted:#7E8590;
  --blue:#2B7BE4; --blue-soft:rgba(43,123,228,.12);
  --green:#16A34A; --green-soft:rgba(22,163,74,.12);
  --red:#DC4C4C; --red-soft:rgba(220,76,76,.12);
  --display:'Satoshi Variable','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--display);-webkit-font-smoothing:antialiased;overflow:hidden}
body{background-image:radial-gradient(rgba(11,12,15,.07) 1px,transparent 1px);background-size:24px 24px}

/* 16:9 stage, scaled to fit the window */
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.slide{position:absolute;inset:0;padding:56px 96px 104px;display:none;grid-template-rows:auto 1fr;gap:28px}
.slide.on{display:grid;animation:enter .35s ease}
@keyframes enter{from{opacity:0}to{opacity:1}}

/* builds: any element with data-b="n" appears on click n. Slides open with build 1 already shown. */
[data-b]:not(.cell):not(.side){opacity:0;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease}
[data-b].in:not(.cell):not(.side){opacity:1;transform:none}
.cell[data-b]>*,.side[data-b]>*{opacity:0;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease}
.cell[data-b].in>*,.side[data-b].in>*{opacity:1;transform:none}
svg [data-b]{transform-box:fill-box;transform:translateY(12px)}
svg [data-b].in{transform:none}
svg .dim{transition:opacity .45s ease}

/* type */
.eyebrow{display:inline-flex;align-items:center;gap:14px;font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.eyebrow::before{content:'';width:36px;height:2px;background:var(--blue)}
h1{font-size:88px;line-height:1.04;letter-spacing:-.025em;font-weight:900;margin:22px 0 0;max-width:19ch;text-wrap:balance}
h1 em,h2 em{font-style:normal;background:var(--blue-soft);padding:0 14px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
h2{font-size:56px;line-height:1.08;letter-spacing:-.02em;font-weight:800;margin:12px 0 0;text-wrap:balance}
.sub{font-size:30px;line-height:1.45;color:var(--text-soft);max-width:44ch;margin:28px 0 0}
.head{display:grid;align-content:start}
.mono{font-family:var(--mono)}

/* slide type: board (one big diagram + caption) */
.board{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 40px 26px;display:grid;grid-template-rows:1fr auto;gap:16px;min-height:0}
.board svg{width:100%;height:100%;display:block}
.cap{margin:0;font-family:var(--mono);font-size:20px;color:var(--muted);line-height:1.4}

/* slide type: cells · 3 facts, or 3 to 5 steps (class="cells steps" + style="--n:4"). Rows share one grid so numbers, claims and sentences align across columns even when a claim wraps. */
.cells{--n:3;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:1fr auto auto auto;gap:0 1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cell{background:var(--panel);padding:36px 40px;display:grid;grid-row:span 4;grid-template-rows:subgrid;row-gap:16px;align-items:start}
.cell svg{width:100%;height:100%;min-height:0;display:block;align-self:stretch}
.cells.steps .num::before{content:'STEP '}
.cells.compact .cell{padding:28px 28px}
.cells.compact .cell h3{font-size:30px}
.cells.compact .cell p{font-size:26px;line-height:1.4}
.num{font-family:var(--mono);font-size:18px;letter-spacing:.12em;color:var(--blue);font-weight:500}
.cell h3{margin:0;font-size:38px;font-weight:800;line-height:1.15;letter-spacing:-.015em}
.cell p{margin:0;font-size:26px;line-height:1.45;color:var(--text-soft)}

/* slide type: pair (without / with) */
.pair{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;gap:0 1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.side{background:var(--panel);padding:44px 56px 40px;display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:22px;align-items:start}
.side .top{display:flex;align-items:center;gap:20px}
.side svg{width:100%;height:100%;min-height:0;display:block}
.mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:28px;flex:0 0 auto}
.mark.x{background:var(--red-soft);color:var(--red)}
.mark.ok{background:var(--green-soft);color:var(--green)}
.side b{display:block;font-family:var(--mono);font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.side p{margin:0;font-size:34px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.side p span{color:var(--text-soft);font-weight:400;display:block;margin-top:10px;font-size:26px}

/* slide type: remember */
.remember{display:grid;align-content:center;justify-items:start;gap:34px}
.remember .k{font-family:var(--mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:500;display:inline-flex;align-items:center;gap:14px}
.remember .k::before{content:'';width:36px;height:2px;background:var(--green)}
.remember p{margin:0;font-size:84px;font-weight:900;line-height:1.05;letter-spacing:-.025em;max-width:16ch;text-wrap:balance}

/* chrome: breadcrumb · dots · count */
.foot{position:absolute;left:96px;right:96px;bottom:40px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.crumb{display:flex;align-items:center;gap:14px;font-weight:500}
.crumb span+span::before,.crumb span+b::before{content:'›';margin-right:14px;color:var(--line-2)}
.crumb b{color:var(--text);font-weight:600}
.dots{display:flex;gap:10px;justify-self:center}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line-2);cursor:pointer}
.dots button.on{background:var(--blue)}
.count{font-variant-numeric:tabular-nums;justify-self:end}

/* ===== WHY DOES THIS MATTER additions. Same light theme and fonts, new slide types. ===== */
:root{
  --ink:#0B0C0F; --on-ink:#FFFFFF; --on-ink-soft:rgba(255,255,255,.64);
  --ink-panel:rgba(255,255,255,.06); --ink-line:rgba(255,255,255,.18); --blue-ink:rgba(43,123,228,.38);
}

/* source chips: where a fact about the person came from */
.srcs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.src{font-family:var(--mono);font-size:16px;line-height:1.2;color:var(--text-soft);border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.src i{font-style:normal;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-right:10px}

/* slide type: context (what I'm working from). Six facts, each with where it came from. */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:0}
.fact{background:var(--panel);padding:26px 32px 24px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:0}
.fact p{margin:0;font-size:26px;line-height:1.35;font-weight:600;letter-spacing:-.005em}
.fact.skip p{color:var(--text-soft);font-weight:400}

/* slide type: ideas (five ideas, five reasons) */
.board.list{grid-template-rows:1fr;padding:14px 48px}
.ideas{list-style:none;margin:0;padding:0;display:grid;align-content:center}
.ideas li{display:grid;grid-template-columns:56px minmax(0,.78fr) minmax(0,1.22fr);column-gap:28px;align-items:baseline;padding:15px 0;border-top:1px solid var(--line)}
.ideas li.hd{border-top:0;padding:4px 0 12px}
.ideas li.hd+li{border-top:0}
.ideas .n{font-family:var(--mono);font-size:18px;letter-spacing:.12em;color:var(--blue);font-weight:500}
.ideas b{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.ideas .r{font-size:26px;line-height:1.35;color:var(--text-soft)}

/* slide type: divider (one per idea). Dark, so the room sees the deck change gear. */
.slide.divider{background:var(--ink);color:var(--on-ink);grid-template-rows:1fr;grid-template-columns:340px minmax(0,1fr);column-gap:64px;align-items:center}
.divider .big{font-family:var(--display);font-weight:900;font-size:300px;line-height:.8;letter-spacing:-.05em;color:var(--blue);font-variant-numeric:tabular-nums}
.divider .why{display:grid;gap:30px;align-content:center}
.divider .eyebrow{color:var(--on-ink-soft)}
.divider h2{margin:0;font-size:60px;color:var(--on-ink);max-width:24ch}
.divider h2 em{background:var(--blue-ink)}
.because{background:var(--ink-panel);border:1px solid var(--ink-line);border-left:4px solid var(--on-ink);border-radius:14px;padding:26px 32px;display:grid;gap:14px}
.because .lbl{color:var(--on-ink-soft)}
.because p{margin:0;font-size:32px;line-height:1.35;font-weight:500;letter-spacing:-.01em;color:var(--on-ink)}
.divider .src{color:var(--on-ink);border-color:var(--ink-line);font-size:18px;padding:8px 16px}
.divider .src i{color:var(--on-ink-soft)}
.stage.dark .foot{color:var(--on-ink-soft)}
.stage.dark .crumb b{color:var(--on-ink)}
.stage.dark .crumb span+span::before,.stage.dark .crumb span+b::before{color:var(--ink-line)}
.stage.dark .dots button{background:var(--ink-line)}
.stage.dark .dots button.on{background:var(--blue)}

/* slide type: explain (picture on top, three columns of copy under it) */
.board.explain{grid-template-rows:minmax(0,1fr) auto;gap:18px;padding:28px 40px 28px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:44px;border-top:1px solid var(--line);padding-top:20px}
.cols>div{display:grid;gap:8px;align-content:start}
.cols p{margin:0;font-size:26px;line-height:1.38;color:var(--text)}
.cols .by{display:block;font-family:var(--mono);font-size:16px;color:var(--muted);margin-top:8px}
.cols .pay .lbl{color:var(--green)}

/* ranked rows: the plan slide */
.rank{list-style:none;margin:0;padding:0;display:grid;align-content:center}
.rank li{display:grid;grid-template-columns:56px 1fr auto;align-items:baseline;column-gap:18px;padding:17px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .n{font-family:var(--mono);font-size:18px;letter-spacing:.12em;color:var(--blue);font-weight:500}
.rank b{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.rank b span{display:block;font-size:26px;font-weight:400;color:var(--text-soft);letter-spacing:0;margin-top:4px}
.rank .t{font-family:var(--mono);font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.board.plan{grid-template-rows:1fr auto;padding:20px 48px 26px}

/* slide type: try (the exact words to paste, plus what you need) */
.try{display:grid;grid-template-columns:1.55fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:0}
.prompt{background:var(--panel);padding:34px 40px;display:grid;grid-template-rows:auto 1fr;gap:20px;min-height:0;position:relative}
.lbl{font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.prompt pre{margin:0;font-family:var(--mono);font-size:26px;line-height:1.5;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel-2);border:1px solid var(--line-2);border-left:4px solid var(--blue);border-radius:12px;padding:26px 30px;overflow:hidden;align-self:start}
.prompt pre i{font-style:normal;color:var(--blue)}
.copy{position:absolute;top:26px;right:40px;font-family:var(--mono);font-size:15px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line-2);background:var(--panel);color:var(--text-soft);border-radius:999px;padding:8px 16px;cursor:pointer}
.copy.done{color:var(--green);border-color:var(--green)}
.need{background:var(--panel);padding:34px 40px;display:grid;align-content:start;gap:24px}
.need div{display:grid;gap:8px}
.need p{margin:0;font-size:26px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.need .pay p{color:var(--green)}

/* a 20-slide deck needs a tighter footer than a 6-slide napkin. A wide dot marks where the explainer and each pitch start. */
.crumb{white-space:nowrap}
.dots{gap:6px}
.dots button{width:8px;height:8px}
.dots button.sec{width:22px;border-radius:4px;margin-left:8px}


/* ===== v3: the explainer and the pitches ===== */

/* slide type: limits (cells for what it can't do yet). Gray numbers: this is honesty, not a feature. */
.cells.limits .num{color:var(--muted)}
.cells.limits .num::before{content:'LIMIT '}
.cell p .by{display:block;font-family:var(--mono);font-size:16px;line-height:1.4;color:var(--muted);margin-top:8px}

/* slide type: stats (two or three numbers worth remembering, each with who measured it) */
.stats{--n:3;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:0}
.stat{background:var(--panel);padding:40px 44px 34px;display:grid;align-content:center;row-gap:16px;min-height:0}
.stat b{font-family:var(--display);font-size:min(144px,calc(330px / var(--n)));line-height:1;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--text);margin:8px 0 4px;white-space:nowrap}
.stat.new b{color:var(--blue)}
.stat.pay b{color:var(--green)}
.stat p{margin:0;font-size:28px;line-height:1.35;color:var(--text-soft)}
.stat .by{font-family:var(--mono);font-size:16px;color:var(--muted)}

/* slide type: handoff (the prompt that carries one idea to any agent) */
.handoff{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:0}
.handoff .prompt{padding:20px 40px 22px;gap:12px}
.handoff .copy{top:14px}
.ask{font-family:var(--mono);font-size:26px;line-height:1.4;color:var(--text);background:var(--panel-2);border:1px solid var(--line-2);border-left:4px solid var(--blue);border-radius:12px;padding:20px 28px;overflow:hidden;min-height:0}
.ask p{margin:0 0 10px}
.ask p:last-child{margin:0}
.ask i{font-style:normal;color:var(--blue)}
.ask b{font-weight:600;color:var(--blue)}
.strip{background:var(--panel);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:44px;padding:18px 40px 22px}
.strip>div{display:grid;gap:6px;align-content:start}
.strip p{margin:0;font-size:26px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
.strip .pay .lbl,.strip .pay p{color:var(--green)}

/* slide type: pick (three pitches side by side; each card jumps to its handoff) */
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto 1fr auto auto;gap:0 1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:0}
.pick{background:var(--panel);padding:34px 40px 30px;display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:18px;align-items:start;color:inherit;text-decoration:none;min-height:0}
.pick:hover{background:var(--panel-2)}
.pick .n{font-family:var(--display);font-size:96px;line-height:.9;font-weight:900;letter-spacing:-.04em;color:var(--blue)}
.pick>b{font-size:38px;line-height:1.12;font-weight:800;letter-spacing:-.015em}
.pick p{margin:0;font-size:26px;line-height:1.38;color:var(--text-soft)}
.pick p .lbl{display:block;margin-bottom:6px}
.pick .get{border-top:1px solid var(--line);padding-top:16px;display:grid;gap:6px}
.pick .get .lbl{color:var(--green)}
.pick .get p{font-weight:600;color:var(--text)}
.pick .go{font-family:var(--mono);font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}

/* ===== MOTION. Fragments never add <style>: they put these classes on SVG or HTML elements.
   Every keyframe says only where the element comes FROM. It always ends on its own attributes,
   so the resting frame, the printed page, and check.py's PNG are the same finished picture.
   Timing per element: style="--d:.4s" (delay), "--t:3s" (loop length), "--fx:-300;--fy:0" (a-travel start offset, SVG units).
   Motion inside a build waits for that build. Put motion classes on children of a [data-b] group, never on the group itself. ===== */
svg .a-pop,svg .a-rise,svg .a-grow,svg .a-grow-y,svg .a-pulse,svg .a-travel{transform-box:fill-box;transform-origin:center}
svg .a-grow{transform-origin:left center}
svg .a-grow-y{transform-origin:center bottom}
.a-grow:not(svg *){transform-origin:left center}
.slide.on .a-fade{animation:a-fade .6s ease var(--d,0s) both}
.slide.on .a-rise{animation:a-rise .6s cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.slide.on .a-pop{animation:a-pop .55s cubic-bezier(.2,.9,.3,1.3) var(--d,0s) both}
.slide.on .a-grow{animation:a-grow .9s cubic-bezier(.3,.7,.2,1) var(--d,0s) both}
.slide.on .a-grow-y{animation:a-grow-y .9s cubic-bezier(.3,.7,.2,1) var(--d,0s) both}
.slide.on .a-dim{animation:a-dim .8s ease var(--d,0s) both}
.a-draw{stroke-dasharray:1}
.slide.on .a-draw{animation:a-draw 1s ease-in-out var(--d,0s) both}
.slide.on .a-flow{animation:a-flow 1.1s linear var(--d,0s) infinite}
.slide.on .a-travel{animation:a-travel var(--t,2.6s) cubic-bezier(.45,0,.35,1) var(--d,0s) infinite both}
.slide.on .a-pulse{animation:a-pulse 1.4s ease-in-out var(--d,0s) 3}
[data-b]:not(.in) :is(.a-fade,.a-rise,.a-pop,.a-grow,.a-grow-y,.a-dim,.a-draw,.a-flow,.a-travel,.a-pulse){animation:none}
@keyframes a-fade{from{opacity:0}}
@keyframes a-rise{from{opacity:0;transform:translateY(24px)}}
@keyframes a-pop{from{opacity:0;transform:scale(.6)}}
@keyframes a-grow{from{transform:scaleX(0)}}
@keyframes a-grow-y{from{transform:scaleY(0)}}
@keyframes a-dim{from{opacity:1}}
@keyframes a-draw{from{stroke-dashoffset:1}}
@keyframes a-flow{from{stroke-dashoffset:24}}
@keyframes a-travel{0%{opacity:0;transform:translate(calc(var(--fx,-240) * 1px),calc(var(--fy,0) * 1px))}15%{opacity:1}75%{opacity:1;transform:none}100%{opacity:1;transform:none}}
@keyframes a-pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.slide.on :is(.a-fade,.a-rise,.a-pop,.a-grow,.a-grow-y,.a-dim,.a-draw,.a-flow,.a-travel,.a-pulse){animation:none!important}}

@media print{
  @page{size:1600px 900px;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{overflow:visible;height:auto;background:var(--bg)}
  .stage{position:relative;left:0;top:0;transform:none;height:auto;box-shadow:none}
  .slide{position:relative;display:grid!important;height:900px;break-after:page;animation:none}
  [data-b],.cell[data-b]>*,.side[data-b]>*{opacity:1!important;transform:none!important}
  .foot,.copy{display:none}
  *{animation:none!important}
}
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- SLIDES -->
  <!-- scripts/stitch.py replaces the SLIDES marker with the title, the explainer, the context slide, the three pitches, and the close. -->

  <!-- CHROME: breadcrumb is the concept trail; last node is the topic -->
  <div class="foot">
    <nav class="crumb"><span>Rundown University</span><span>Why it matters</span><b>TOPIC</b></nav>
    <div class="dots" id="dots"></div>
    <span class="count" id="count"></span>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const slides = [...stage.querySelectorAll('.slide')];
  const dots = document.getElementById('dots');
  const count = document.getElementById('count');
  let i = 0, step = 0;

  const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / 1600, innerHeight / 900));
  addEventListener('resize', fit); fit();

  const buildsIn = s => Math.max(0, ...[...s.querySelectorAll('[data-b]')].map(e => +e.dataset.b));
  const first = s => Math.min(1, buildsIn(s));   // slides never open empty

  slides.forEach((_, k) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', 'Slide ' + (k + 1));
    const f = slides[k].dataset.frag || '', pf = k ? slides[k - 1].dataset.frag || '' : '';
    if (slides[k].classList.contains('divider') || (f === 'explain' && pf !== 'explain')) b.classList.add('sec');
    b.onclick = e => { e.stopPropagation(); go(k, true); };
    dots.appendChild(b);
  });

  // numbers with class a-count run up from zero when they appear, then land on the text as written
  const still = window.WDTM_STILL || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let counted = new Set(), shown = -1;
  const countUp = el => {
    const orig = el.dataset.final || (el.dataset.final = el.textContent);
    const m = orig.match(/\d[\d,]*(\.\d+)?/);
    if (!m) return;
    const raw = m[0].replace(/,/g, ''), target = parseFloat(raw), dec = (raw.split('.')[1] || '').length, comma = m[0].includes(',');
    const fmt = v => { const n = comma ? v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : v.toFixed(dec); return orig.slice(0, m.index) + n + orig.slice(m.index + m[0].length); };
    const d = getComputedStyle(el).getPropertyValue('--d').trim(), delay = d.endsWith('ms') ? parseFloat(d) : (parseFloat(d) || 0) * 1000;
    const t0 = performance.now(), dur = 1200;
    el.textContent = fmt(0);
    const tick = now => { const p = Math.min(1, Math.max(0, (now - t0 - delay) / dur)); el.textContent = p >= 1 ? orig : fmt(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };
  const runCounts = () => {
    if (shown !== i) { counted.forEach(el => { if (el.dataset.final) el.textContent = el.dataset.final; }); counted = new Set(); shown = i; }
    if (still) return;
    slides[i].querySelectorAll('.a-count').forEach(el => {
      if (counted.has(el) || el.closest('[data-b]:not(.in)')) return;
      counted.add(el); countUp(el);
    });
  };

  const render = () => {
    slides.forEach((s, k) => {
      s.classList.toggle('on', k === i);
      s.querySelectorAll('[data-b]').forEach(e =>
        e.classList.toggle('in', k < i || (k === i && +e.dataset.b <= step)));
    });
    stage.classList.toggle('dark', slides[i].classList.contains('divider'));
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
    count.textContent = (i + 1) + ' / ' + slides.length;
    history.replaceState(null, '', '#' + (i + 1));
    runCounts();
  };
  const go = (k, full) => { i = Math.max(0, Math.min(slides.length - 1, k)); step = full ? buildsIn(slides[i]) : first(slides[i]); render(); };
  const next = () => { if (step < buildsIn(slides[i])) step++; else if (i < slides.length - 1) { i++; step = first(slides[i]); } render(); };
  const prev = () => { if (step > first(slides[i])) step--; else if (i > 0) { i--; step = buildsIn(slides[i]); } render(); };

  addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown', 'l', 'j'].includes(e.key)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'h', 'k', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(slides.length - 1, true);
    else if (e.key === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
  stage.addEventListener('click', e => {
    if (e.target.closest('.copy') || e.target.closest('pre') || e.target.closest('.ask') || e.target.closest('a')) return;   // let people copy the prompt
    e.clientX < innerWidth * 0.25 ? prev() : next();
  });
  stage.querySelectorAll('.copy').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const text = b.parentElement.querySelector('pre, .ask').innerText.trim();
    const ok = () => { b.textContent = 'Copied'; b.classList.add('done'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('done'); }, 1600); };
    const old = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); ok(); };
    navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text).then(ok, old) : old();
  }));

  addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n >= 1 && n <= slides.length && n !== i + 1) go(n - 1, true); });

  const h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= slides.length) go(h - 1, true); else render();
})();
</script>
</body>
</html>
